[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "eva-kernel-image"
dynamic = ["version"]
description = "Parser, builder, and CLI for the Fritz!Box EVA kernel image format"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Grische" }]
requires-python = ">=3.10"
keywords = [
    "fritzbox",
    "avm",
    "eva",
    "bootloader",
    "firmware",
    "lzma",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Boot",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
eva-image = "eva_kernel_image.cli:main"

[project.urls]
Homepage = "https://github.com/grische/eva-kernel-image"
Repository = "https://github.com/grische/eva-kernel-image"
Documentation = "https://github.com/grische/eva-kernel-image#readme"
Issues = "https://github.com/grische/eva-kernel-image/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI/TestPyPI reject PEP 440 local versions (the "+gSHA" suffix), so strip it.
# Produces e.g. "0.1.1.dev5" instead of "0.1.1.dev5+g1a2b3c4".
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/eva_kernel_image/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eva_kernel_image"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter; no hard cap

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
